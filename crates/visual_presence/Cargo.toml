[package]
name = "voxy-visual-presence"
description = "Visual Presence Engine -- GPU-accelerated particle system, desktop overlay, and animated companion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
voxy-shared = { path = "../shared" }
voxy-companion-intelligence = { path = "../companion_intelligence" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# GPU rendering
wgpu = { version = "24", features = ["dx12"] }
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }

# Math and utilities
glam = { version = "0.29", features = ["serde", "bytemuck"] }
rand = "0.8"

[dev-dependencies]
tokio = { workspace = true }
