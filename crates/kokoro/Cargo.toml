[package]
name = "voxy-kokoro"
description = "Kokoro local TTS provider (Piper TTS)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
piper-engine = ["dep:piper-rs"]

[dependencies]
voxy-shared = { workspace = true }
voxy-config = { workspace = true }
voxy-provider-core = { path = "../provider_core" }
voxy-voice-orchestrator = { path = "../voice_orchestrator" }
parking_lot = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
piper-rs = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true }
